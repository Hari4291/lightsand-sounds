<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc1"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6a1e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Monogram Emblem -->
  <g transform="translate(10, 10)">
    <!-- Crest Frame -->
    <path d="M40 5 L70 20 L70 55 C70 72 40 82 40 82 C40 82 10 72 10 55 L10 20 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M40 12 L63 24 L63 52 C63 65 40 73 40 73 C40 73 17 65 17 52 L17 24 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="2 2" />
    
    <!-- Crown / Stars -->
    <path d="M28 32 L34 38 L40 28 L46 38 L52 32 L50 48 L30 48 Z" fill="url(#goldGrad)" />
    <!-- Monogram Initial -->
    <text x="40" y="68" font-family="'Playfair Display', serif" font-weight="700" font-size="17" 
          fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">GLS</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 48)">
    <text x="0" y="0" font-family="'Playfair Display', serif" font-weight="700" font-size="24" 
          fill="url(#goldGrad)" letter-spacing="1.2">GURU LIGHTS AND SOUNDS</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11.5" 
          fill="#94a3b8" letter-spacing="3">EVENT SERVICES &bull; PALURI VARI PALLI</text>
  </g>
</svg>
